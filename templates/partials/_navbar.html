<nav class="navbar navbar-expand-lg navbar-dark ms-navbar">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center gap-2" href="{% url 'home' %}">
      <span class="ms-logo"><i class="bi bi-droplet-half"></i></span> MedStep
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
            aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
        <li class="nav-item">
          <a class="nav-link{% if request.resolver_match.url_name == 'home' %} active{% endif %}" href="{% url 'home' %}">Home</a>
        </li>
        {% if user.is_authenticated %}
          <li class="nav-item">
            <a class="nav-link{% if request.resolver_match.app_name == 'dashboard' %} active{% endif %}" href="{% url 'dashboard:home' %}">Dashboard</a>
          </li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle d-flex align-items-center gap-2" href="#" role="button"
               data-bs-toggle="dropdown" aria-expanded="false">
              <i class="bi bi-person-circle fs-5"></i>
              <span>{{ user.get_full_name|default:user.username }}</span>
            </a>
            <ul class="dropdown-menu dropdown-menu-end">
              <li>
                {# Logout must be a POST (with CSRF token), never a plain link. #}
                <form method="post" action="{% url 'accounts:logout' %}">
                  {% csrf_token %}
                  <button type="submit" class="dropdown-item text-danger">
                    <i class="bi bi-box-arrow-right me-2"></i>Sign out
                  </button>
                </form>
              </li>
            </ul>
          </li>
        {% else %}
          <li class="nav-item">
            <a class="nav-link{% if request.resolver_match.url_name == 'login' %} active{% endif %}" href="{% url 'accounts:login' %}">Sign in</a>
          </li>
          <li class="nav-item">
            <a class="btn btn-primary btn-sm px-3" href="{% url 'accounts:register' %}">Create account</a>
          </li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>
